<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Area (openPlan3D Test)</title>
  <link rel="stylesheet" href="/css/admin-utilities.css">
  <script src="/js/admin-hotkey-save.js"></script>
  <script src="/js/openplan3d-measurement-bridge.js"></script>
  <script src="/js/openplan3d-host.js"></script>
  <style>
  .util-ra-openplan3d-wrap { display: flex; flex-direction: column; width: 100%; height: calc(100vh - 100px); min-height: 600px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; position: relative; }
  .util-ra-openplan3d-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.5rem 1rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; min-height: 58px; }
  .openplan3d-tool-btn, .util-ra-engine-toggle, .openplan3d-save-btn { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px; padding: 0.5rem 0.85rem; font-size: 0.88rem; border-radius: 6px; cursor: pointer; }
  .openplan3d-settings-drawer { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0.6rem 1rem; }
  .openplan3d-metrics-ribbon { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 1rem; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
  .openplan3d-metric-card { display: inline-flex; align-items: baseline; gap: 0.35rem; padding: 0.25rem 0.65rem; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }
  @media (max-width: 768px) {
    .openplan3d-tool-btn, .openplan3d-save-btn, .util-ra-engine-toggle { min-height: 44px; padding: 0.5rem 0.75rem; }
  }
  .openplan3d-modal[hidden], .openplan3d-modal [hidden] { display: none !important; }
  .openplan3d-modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; padding: 0.75rem; box-sizing: border-box; }
  .openplan3d-modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); }
  .openplan3d-modal-panel { position: relative; z-index: 1; width: min(420px, 100%); max-height: min(90dvh, 640px); overflow: auto; background: var(--admin-surface, #ffffff); color: var(--admin-text, #1e293b); border: 1px solid var(--admin-border, #e2e8f0); border-radius: 10px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.2); padding: 1rem; }
  .openplan3d-modal-title { margin: 0 0 0.4rem; font-size: 1.05rem; color: var(--admin-heading, #0f172a); }
  .openplan3d-modal-body { margin: 0 0 0.75rem; font-size: 0.9rem; color: var(--admin-muted, #64748b); line-height: 1.45; }
  .openplan3d-modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; }
  .openplan3d-modal-actions--stack { justify-content: stretch; margin-bottom: 0.5rem; }
  .openplan3d-modal-actions .admin-btn { min-height: 44px; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
  .openplan3d-modal-actions--stack .admin-btn { flex: 1 1 160px; }
  .admin-btn--primary { background: #2563eb; color: #fff; border-color: #1d4ed8; }
  .admin-btn--ghost { background: transparent; color: inherit; border-color: #cbd5e1; }
  @media (min-width: 700px) { .openplan3d-modal { align-items: center; } }
  @media (max-width: 390px) {
    .openplan3d-modal { padding: 0.5rem; align-items: flex-end; }
    .openplan3d-modal-panel { width: 100%; }
  }
  .admin-dark { --admin-surface: #0f172a; --admin-text: #e2e8f0; --admin-border: #334155; --admin-heading: #f8fafc; --admin-muted: #94a3b8; background: #020617; color: #e2e8f0; }
  .admin-dark .util-ra-openplan3d-wrap { background: #0f172a; border-color: #334155; }
  .admin-dark .util-ra-openplan3d-header { background: #1e293b; border-color: #334155; }
  .admin-dark .openplan3d-modal-backdrop { background: rgba(2, 6, 23, 0.72); }
  .admin-dark .openplan3d-modal-panel { background: #111a2c; color: #e2e8f0; border-color: #334155; }
  .admin-dark .openplan3d-modal-title { color: #f8fafc; }
  .admin-dark .openplan3d-modal-body, .admin-dark .openplan3d-modal-field-label { color: #94a3b8; }
  .admin-dark .admin-btn--ghost { border-color: #475569; color: #e2e8f0; }
  </style>
</head>
<body style="margin: 0; padding: 10px; font-family: sans-serif;">

<div class="util-ra-openplan3d-wrap"
  data-room-area-openplan3d
  data-projects='[{"id":1,"name":"Test Suite Project","client_project_id":1,"client_project_name":"Suite 101","rooms":[{"id":10,"name":"Living Room","area_sqft":150.0,"wall_height_ft":8.0,"ceiling_height_ft":8.0,"flooring_waste_percent":10.0,"flooring_box_sqft":20.0,"plan":{"unit":"cm","version":"1.0","floor":{"walls":[{"id":"w1","start":{"x":0,"y":0},"end":{"x":365.76,"y":0},"height":243.84,"thickness":10},{"id":"w2","start":{"x":365.76,"y":0},"end":{"x":365.76,"y":381},"height":243.84,"thickness":10},{"id":"w3","start":{"x":365.76,"y":381},"end":{"x":0,"y":381},"height":243.84,"thickness":10},{"id":"w4","start":{"x":0,"y":381},"end":{"x":0,"y":0},"height":243.84,"thickness":10}],"rooms":[{"id":"r1","name":"Living Room","walls":["w1","w2","w3","w4"],"polygon":[{"x":0,"y":0},{"x":365.76,"y":0},{"x":365.76,"y":381},{"x":0,"y":381}]}]}}}]}]'
  data-client-projects='[{"id":1,"name":"Suite 101"},{"id":2,"name":"Kitchen remodel"}]'
  data-initial-room-id="10"
  data-initial-project-id="1"
  data-bound-client-project=""
  data-room-store-template="/api/projects/__ID__/rooms"
  data-room-update-template="/api/rooms/__ID__"
  data-room-destroy-template="/api/rooms/__ID__/destroy"
  data-project-store-url="/api/projects"
  data-project-update-template="/api/projects/__ID__"
  data-quote-room-template="/admin/quotations?layout=room:__ID__"
  data-quote-project-template="/admin/quotations?layout=project:__ID__"
>
  <input type="hidden" id="openplan3d-csrf" value="mock-token-xyz">

  <header class="util-ra-openplan3d-header">
    <div class="util-ra-openplan3d-header__primary">
      <a href="/admin/utilities" class="admin-btn admin-btn--ghost util-ra-openplan3d-back" aria-label="All utilities">
        <span>Back</span>
      </a>

      <div class="util-ra-openplan3d-titles">
        <div class="util-ra-openplan3d-title-row">
          <h1 class="util-ra-openplan3d-title">Room Area</h1>
          <span class="util-ra-badge util-ra-badge--openplan3d">openPlan3D</span>
          <span id="openplan3d-dirty-badge" class="openplan3d-dirty-badge" hidden title="Unsaved changes">
            <span class="openplan3d-dirty-dot"></span> Unsaved
          </span>
        </div>
      </div>
    </div>

    <div class="util-ra-openplan3d-header__selectors">
      <div class="openplan3d-control-group">
        <label for="openplan3d-project-select" class="openplan3d-control-label">Project</label>
        <select id="openplan3d-project-select" class="admin-input openplan3d-select" aria-label="Select Project">
          <option value="">— Select Project —</option>
        </select>
      </div>

      <div class="openplan3d-control-group">
        <label for="openplan3d-room-select" class="openplan3d-control-label">Room</label>
        <select id="openplan3d-room-select" class="admin-input openplan3d-select" aria-label="Select Room">
          <option value="">— Select Room —</option>
        </select>
      </div>

      <div class="openplan3d-control-group openplan3d-control-group--name">
        <label for="openplan3d-room-name" class="openplan3d-control-label">Room Name</label>
        <input type="text" id="openplan3d-room-name" class="admin-input openplan3d-input" placeholder="Room name" maxlength="120" aria-label="Room Name">
      </div>
    </div>

    <div class="util-ra-openplan3d-header__actions">
      <button type="button" class="admin-btn admin-btn--ghost openplan3d-tool-btn" id="openplan3d-new-room-btn" title="Create new room in current project">
        <span class="openplan3d-btn-label">New Room</span>
      </button>

      <button type="button" class="admin-btn admin-btn--ghost openplan3d-tool-btn" id="openplan3d-settings-btn" aria-expanded="false" title="Room finish and height settings">
        <span class="openplan3d-btn-label">Settings</span>
      </button>

      <a href="/admin/utilities/room-area?engine=canvas" class="admin-btn admin-btn--secondary util-ra-engine-toggle" title="Switch back to Classic Canvas drawing tool">
        <span class="openplan3d-btn-label">Classic Canvas</span>
      </a>

      <a href="#" class="admin-btn admin-btn--ghost openplan3d-tool-btn" id="openplan3d-quote-btn" hidden title="Create or add lines to a quotation">
        <span class="openplan3d-btn-label">Quote</span>
      </a>

      <button type="button" class="admin-btn admin-btn--primary openplan3d-save-btn" id="openplan3d-save-btn" data-hotkey-save disabled title="Save Plan (Ctrl+S)">
        <span class="openplan3d-save-text">Save Plan</span>
        <span class="openplan3d-save-spinner" hidden>Saving...</span>
      </button>
    </div>
  </header>

  <div class="openplan3d-settings-drawer" id="openplan3d-settings-drawer" hidden>
    <div class="openplan3d-settings-grid">
      <div class="admin-form-group openplan3d-setting-item">
        <label for="ra-wall-height">Wall Height (ft)</label>
        <input type="number" step="0.1" min="1" max="25" id="ra-wall-height" class="admin-input" value="8">
      </div>
      <div class="admin-form-group openplan3d-setting-item">
        <label for="ra-ceiling-height">Ceiling Height (ft)</label>
        <input type="number" step="0.1" min="1" max="25" id="ra-ceiling-height" class="admin-input" value="8">
      </div>
      <div class="admin-form-group openplan3d-setting-item">
        <label for="ra-floor-waste">Flooring Waste (%)</label>
        <input type="number" step="1" min="0" max="100" id="ra-floor-waste" class="admin-input" value="10">
      </div>
      <div class="admin-form-group openplan3d-setting-item">
        <label for="ra-floor-box">Box Size (sf)</label>
        <input type="number" step="0.5" min="1" max="200" id="ra-floor-box" class="admin-input" value="20">
      </div>
      <div class="openplan3d-setting-item openplan3d-setting-item--close">
        <button type="button" class="admin-btn admin-btn--ghost admin-btn--sm" id="openplan3d-settings-close">Close</button>
      </div>
    </div>
  </div>

  <div class="openplan3d-metrics-ribbon" id="openplan3d-metrics-ribbon">
    <div class="openplan3d-metric-card">
      <span class="openplan3d-metric-label">Floor Area</span>
      <span class="openplan3d-metric-val" id="metric-area">0.00</span>
      <span class="openplan3d-metric-unit">sq ft</span>
    </div>
    <div class="openplan3d-metric-card">
      <span class="openplan3d-metric-label">Perimeter</span>
      <span class="openplan3d-metric-val" id="metric-perimeter">0.00</span>
      <span class="openplan3d-metric-unit">lf</span>
    </div>
    <div class="openplan3d-metric-card">
      <span class="openplan3d-metric-label">Baseboard</span>
      <span class="openplan3d-metric-val" id="metric-baseboard">0.00</span>
      <span class="openplan3d-metric-unit">lf</span>
    </div>
    <div class="openplan3d-metric-card">
      <span class="openplan3d-metric-label">Net Wall Area</span>
      <span class="openplan3d-metric-val" id="metric-wall-area">0.00</span>
      <span class="openplan3d-metric-unit">sq ft</span>
    </div>
    <div class="openplan3d-metric-card">
      <span class="openplan3d-metric-label">Openings</span>
      <span class="openplan3d-metric-val" id="metric-openings">0 doors · 0 windows</span>
    </div>
    <div class="openplan3d-metric-card">
      <span class="openplan3d-metric-label">Casing</span>
      <span class="openplan3d-metric-val" id="metric-casing">0.00</span>
      <span class="openplan3d-metric-unit">lf</span>
    </div>
    <div class="openplan3d-metric-card">
      <span class="openplan3d-metric-label">Boxes</span>
      <span class="openplan3d-metric-val" id="metric-boxes">0</span>
      <span class="openplan3d-metric-unit">boxes</span>
    </div>
  </div>

  <div id="openplan3d-feedback" class="openplan3d-feedback" hidden role="alert" aria-live="polite"></div>
  <div id="openplan3d-noscale-warning" class="openplan3d-noscale-warning" hidden role="status">This room has no scale. Measurements may be wrong until scale is set.</div>
  <div id="openplan3d-modal" class="openplan3d-modal" hidden>
    <div class="openplan3d-modal-backdrop" data-openplan3d-modal-dismiss tabindex="-1" aria-hidden="true"></div>
    <div class="openplan3d-modal-panel" role="dialog" aria-modal="true" aria-labelledby="openplan3d-modal-title">
      <h2 id="openplan3d-modal-title" class="openplan3d-modal-title">Confirm</h2>
      <p id="openplan3d-modal-body" class="openplan3d-modal-body"></p>
      <label id="openplan3d-modal-input-wrap" class="openplan3d-modal-field" hidden>
        <span class="openplan3d-modal-field-label">Name</span>
        <input type="text" id="openplan3d-modal-input" class="admin-input" maxlength="120">
      </label>
      <div id="openplan3d-modal-link" class="openplan3d-modal-link" hidden>
        <div class="openplan3d-modal-link-head">
          <span class="openplan3d-modal-field-label">Client project</span>
        </div>
        <label class="openplan3d-modal-field" for="openplan3d-modal-client-project">
          <select id="openplan3d-modal-client-project" class="admin-input" aria-label="Client project">
            <option value="">— Select a client project —</option>
          </select>
        </label>
        <div class="openplan3d-modal-actions openplan3d-modal-actions--stack">
          <button type="button" class="admin-btn admin-btn--primary" id="openplan3d-modal-link-btn">Link to a project</button>
          <button type="button" class="admin-btn admin-btn--ghost" id="openplan3d-modal-standalone-btn">Keep standalone</button>
          <button type="button" class="admin-btn admin-btn--ghost" id="openplan3d-modal-link-cancel">Cancel</button>
        </div>
      </div>
      <div id="openplan3d-modal-actions" class="openplan3d-modal-actions">
        <button type="button" class="admin-btn admin-btn--ghost" id="openplan3d-modal-cancel">Cancel</button>
        <button type="button" class="admin-btn admin-btn--primary" id="openplan3d-modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <main class="util-ra-openplan3d-frame-container" id="openplan3d-container">
    <iframe
      id="openplan3d-iframe"
      src="about:blank"
      title="openPlan3D Floor Plan Editor"
      class="util-ra-openplan3d-iframe"
    ></iframe>
  </main>
</div>
</body>
</html>
