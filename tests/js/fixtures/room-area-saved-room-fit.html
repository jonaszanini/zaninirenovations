<!DOCTYPE html>
<html lang="en" class="is-geom-first-fit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Area saved-room fit</title>
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin-utilities.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #edf0f2;
    }
    .util-ra--fullpage {
      height: 100%;
    }
    html.is-geom-first-fit .util-ra-canvas-wrap {
      width: 900px !important;
      height: 640px !important;
      flex: 0 0 auto !important;
      min-height: 640px !important;
    }
    .geom-required {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
  </style>
</head>
<body>
  <div
    class="util-ra util-ra--fullpage util-ra--chrome-v2"
    data-room-area
    data-ra-fullpage="1"
    data-ra-chrome="1"
    data-ra-initial-room-id="7"
    data-ra-guide-url="/admin/utilities/room-area/guide"
    data-projects='[{"id":1,"name":"Saved kitchen","client_project_id":null,"client_project_name":null,"scale_pixels_per_foot":12,"wall_thickness_in":0,"canvas_width":900,"canvas_height":640,"rooms":[{"id":7,"name":"Kitchen","vertices":null,"canvas":{"v":3,"groups":[{"id":"g1","color":"#024768","polygons":[{"id":"p1","closed":true,"vertices":[{"x":0,"y":0},{"x":144,"y":0},{"x":144,"y":120},{"x":0,"y":120}]}]}],"objects":[]},"group_summaries":[],"metrics":{},"canvas_width":900,"canvas_height":640,"scale_pixels_per_foot":12,"wall_height_ft":8,"ceiling_height_ft":8,"flooring_waste_percent":10,"flooring_direction":0,"flooring_box_sqft":20,"background_url":null,"pdf_url":null,"area_sqft":120,"photo_count":0,"photos":[]}]}]'
    data-client-projects="[]"
    data-validate-url="/admin/utilities/room-area/validate"
    data-project-store-url="/admin/utilities/room-area/projects"
    data-project-update-template="/admin/utilities/room-area/projects/__ID__"
    data-project-destroy-template="/admin/utilities/room-area/projects/__ID__"
    data-room-store-template="/admin/utilities/room-area/projects/__ID__/rooms"
    data-room-update-template="/admin/utilities/room-area/rooms/__ID__"
    data-room-destroy-template="/admin/utilities/room-area/rooms/__ID__"
    data-room-background-upload-template="/admin/utilities/room-area/rooms/__ID__/background"
    data-room-background-destroy-template="/admin/utilities/room-area/rooms/__ID__/background"
    data-pdf-url="/admin/utilities/room-area/pdf"
    data-room-pdf-template="/admin/utilities/room-area/rooms/__ID__/pdf"
    data-room-photos-store-template="/admin/utilities/room-area/rooms/__ID__/photos"
    data-room-photo-show-template="/admin/utilities/room-area/rooms/__RID__/photos/__PID__"
    data-room-photo-update-template="/admin/utilities/room-area/rooms/__RID__/photos/__PID__"
    data-room-photo-destroy-template="/admin/utilities/room-area/rooms/__RID__/photos/__PID__"
    data-quote-room-template="/admin/utilities/room-area/quote?layout=room:__ID__"
    data-quote-project-template="/admin/utilities/room-area/quote?layout=project:__ID__">
    <input type="hidden" id="util-ra-csrf" value="test">

    <header class="util-ra-full-header">
      <div class="util-ra-full-header__row util-ra-full-header__row--primary">
        <a href="#" class="admin-btn admin-btn--ghost util-ra-full-header__back" aria-label="All utilities">
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
          <span class="util-ra-full-header__back-label">All utilities</span>
        </a>
        <div class="util-ra-full-header__titles">
          <input class="admin-input util-ra-full-header__name" type="text" data-ra-full-title value="Kitchen" placeholder="Room name">
        </div>
        <button type="button" class="admin-btn admin-btn--primary util-ra-full-header__save" data-ra-header-save aria-label="Save room">
          <i class="fa fa-save" aria-hidden="true"></i>
          <span class="util-ra-full-header__save-label">Save</span>
        </button>
      </div>
    </header>

    <div class="geom-required">
      <select data-ra-project-select></select>
      <button type="button" data-ra-new-project-toggle>New</button>
      <div data-ra-new-project hidden></div>
      <button type="button" data-ra-create-project>Create</button>
      <button type="button" data-ra-delete-project>Delete</button>
      <select data-ra-link-client-project></select>
      <div data-ra-linked hidden><a data-ra-linked-link href="#"></a></div>
      <div data-ra-empty hidden></div>
      <p data-ra-rooms-empty hidden></p>
      <ul data-ra-rooms-list></ul>
      <button type="button" data-ra-zoom-in>Zoom in</button>
      <button type="button" data-ra-zoom-out>Zoom out</button>
      <button type="button" data-ra-side-toggle>Panel</button>
      <div data-ra-total>
        <strong data-ra-total-sqft>0</strong>
        <button type="button" data-ra-copy-total>Copy</button>
      </div>
      <div data-ra-live-area>
        <span data-ra-live-active-shape></span>
        <span data-ra-live-grand-total></span>
        <span data-ra-live-sqft></span>
        <span data-ra-live-sqm></span>
        <span data-ra-live-perimeter></span>
        <span data-ra-live-baseboard></span>
        <span data-ra-live-wall-area></span>
        <span data-ra-live-counts></span>
        <span data-ra-live-ceiling-area></span>
        <span data-ra-live-boxes></span>
        <span data-ra-live-casing></span>
        <ul data-ra-live-group-list></ul>
        <span data-ra-scale-status></span>
      </div>
    </div>

    <div class="util-ra-workspace" data-ra-workspace hidden>
      <div class="util-ra-stage">
        <div class="util-ra-stage__main">
          <div class="util-ra-canvas-card">
            <div class="util-ra-canvas-toolbar">
              <div class="util-ra-phone-bar" data-ra-phone-bar>
                <div class="util-ra-phone-bar__scroll" data-ra-phone-scroll>
                  <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-phone-undo aria-label="Undo"></button>
                  <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-phone-redo aria-label="Redo"></button>
                  <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-phone-close aria-label="Close shape"></button>
                  <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-phone-ruler aria-label="Measure distance"></button>
                  <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-phone-snap aria-label="Angle snap"></button>
                </div>
                <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn util-ra-phone-bar__more" data-ra-more-toggle aria-label="More tools"></button>
              </div>
              <div class="util-ra-toolbar__groups">
                <div class="util-ra-tool-group util-ra-tool-group--draw">
                  <div class="util-ra-tool-group__head">
                    <span class="util-ra-tool-group__label">Draw / Edit</span>
                    <div class="util-ra-help"><button type="button" class="util-ra-help-q" data-ra-help-pop="draw" aria-label="About draw">ⓘ</button></div>
                  </div>
                  <div class="util-ra-tool-group__actions">
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-close-shape aria-label="Close shape">C</button>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-add-area aria-label="Add area to this group">+</button>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-add-area-new-group aria-label="Start a new color group">G</button>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-delete-area aria-label="Delete active area">-</button>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-ruler-toggle aria-label="Measure distance">R</button>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-clear-shape aria-label="Clear all areas">E</button>
                  </div>
                </div>
                <div class="util-ra-tool-group util-ra-tool-group--measure">
                  <div class="util-ra-tool-group__head">
                    <span class="util-ra-tool-group__label">Measure / Units</span>
                    <div class="util-ra-help"><button type="button" class="util-ra-help-q" data-ra-help-pop="measure" aria-label="About measure">ⓘ</button></div>
                  </div>
                  <div class="util-ra-tool-group__actions">
                    <div class="util-ra-unit-system" role="group" aria-label="Imperial or metric display">
                      <button type="button" class="admin-btn admin-btn--ghost util-ra-unit-system__btn is-active" data-ra-unit-system="imperial" aria-pressed="true">Imperial</button>
                      <button type="button" class="admin-btn admin-btn--ghost util-ra-unit-system__btn" data-ra-unit-system="metric" aria-pressed="false">Metric</button>
                    </div>
                    <select class="admin-input util-ra-measure-unit" data-ra-measure-unit aria-label="Imperial format">
                      <option value="feet_inch_frac" selected>ft-in-frac</option>
                      <option value="feet_decimal">Decimal ft</option>
                      <option value="inch">Inches</option>
                    </select>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-calibrate-toggle aria-label="Calibrate scale from a known wall">Calibrate</button>
                    <input class="admin-input" type="text" inputmode="decimal" placeholder="e.g. 12' 6 1/2&quot;" data-ra-known-length disabled>
                    <button type="button" class="admin-btn admin-btn--primary util-ra-icon-btn" data-ra-apply-scale disabled aria-label="Apply known length">Apply</button>
                    <label class="admin-btn admin-btn--ghost util-ra-icon-btn util-ra-file-label">
                      <span>Upload plan</span>
                      <input type="file" accept="image/jpeg,image/png,image/webp" data-ra-bg-file hidden>
                    </label>
                  </div>
                </div>
                <div class="util-ra-tool-group util-ra-tool-group--room-tools">
                  <div class="util-ra-tool-group__head">
                    <span class="util-ra-tool-group__label">Room tools</span>
                    <div class="util-ra-help"><button type="button" class="util-ra-help-q" data-ra-help-pop="room-tools" aria-label="About room tools">ⓘ</button></div>
                  </div>
                  <div class="util-ra-tool-group__actions">
                    <select class="admin-input util-ra-dim-mode" data-ra-dimensions-mode aria-label="Dimension labels">
                      <option value="all" selected>All dims</option>
                    </select>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn is-active" data-ra-snap-toggle aria-pressed="true" aria-label="Angle snap">S</button>
                    <button type="button" class="admin-btn admin-btn--ghost util-ra-icon-btn" data-ra-templates-toggle aria-label="Room templates">T</button>
                    <label class="admin-btn admin-btn--ghost util-ra-icon-btn util-ra-icon-toggle" data-ra-lock-layers-wrap>
                      <input type="checkbox" class="util-sr-only" data-ra-lock-layers>
                      <span class="util-sr-only">Lock layers</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
            <div class="util-ra-canvas-wrap" data-ra-canvas-wrap>
              <div id="ra-konva-container" class="util-ra-konva"></div>
              <p class="util-ra-feedback" data-ra-feedback hidden aria-live="polite"></p>
            </div>
          </div>
        </div>
        <aside class="util-ra-side" data-ra-side>
          <button type="button" class="util-ra-sheet-handle" data-ra-sheet-handle aria-label="Expand or collapse panel" aria-expanded="false">
            <span class="util-ra-sheet-handle__bar" aria-hidden="true"></span>
          </button>
          <div class="util-ra-sheet-strip" data-ra-sheet-strip>
            <div class="util-ra-sheet-strip__dock" data-ra-sheet-dock></div>
            <div class="util-ra-sheet-strip__total">
              <span class="util-ra-sheet-strip__label">Area</span>
              <strong data-ra-sheet-total>120 sq ft</strong>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var orig = window.requestAnimationFrame;
      window.requestAnimationFrame = function (cb) {
        return orig.call(window, function (stamp) {
          cb(stamp);
          if (!document.documentElement.classList.contains('is-geom-first-fit')) return;
          if (!window.Konva || !window.Konva.stages || !window.Konva.stages[0]) return;
          var world = window.Konva.stages[0].getLayers()[0] && window.Konva.stages[0].getLayers()[0].getChildren()[0];
          if (!world || world.scaleX() < 2.85) return;
          document.documentElement.classList.remove('is-geom-first-fit');
          var wrap = document.querySelector('[data-ra-canvas-wrap]');
          if (wrap) void wrap.offsetWidth;
        });
      };
    })();
  </script>
  <script src="/vendor-test/konva.min.js"></script>
  <script src="/js/room-area-lib.js"></script>
  <script src="/js/admin-utilities-room-area.js"></script>
</body>
</html>
