<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>openPlan3D embed test</title>
  <script src="/js/openplan3d-editor-bridge.js"></script>
</head>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #0f172a; color: #f8fafc; }
    .vendor-top-bar { height: 48px; background: linear-gradient(to right, #1e293b, #334155); display: flex; align-items: center; padding: 0 1rem; gap: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .vendor-top-bar a, .vendor-top-bar button { padding: 0.35rem 0.75rem; border-radius: 4px; font-size: 0.85rem; border: none; cursor: pointer; text-decoration: none; color: #fff; background: rgba(255,255,255,0.1); }
    .editor-workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
    .editor-sidebar { width: 220px; background: #1e293b; border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 0.75rem; gap: 0.5rem; }
    .sidebar-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 700; margin-bottom: 0.25rem; }
    .tool-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.75rem; background: #334155; border: 1px solid #475569; border-radius: 6px; color: #f8fafc; font-size: 0.85rem; cursor: pointer; }
    .tool-btn:hover, .tool-btn.active { background: #3b82f6; border-color: #60a5fa; }
    .editor-viewport { flex: 1; display: flex; flex-direction: column; position: relative; background: #090d16; }
    .canvas-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
    .editor-canvas { width: 100%; height: 100%; border: none; background: radial-gradient(circle, #1e293b 1px, transparent 1px); background-size: 20px 20px; }
    .viewport-overlay { position: absolute; top: 12px; left: 12px; display: flex; gap: 0.5rem; }
    .overlay-badge { background: rgba(15,23,42,0.85); backdrop-filter: blur(4px); padding: 0.35rem 0.65rem; border-radius: 4px; font-size: 0.75rem; border: 1px solid #334155; }
    .editor-properties { width: 240px; background: #1e293b; border-left: 1px solid rgba(255,255,255,0.1); padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .prop-row { display: flex; flex-direction: column; gap: 0.25rem; }
    .prop-label { font-size: 0.72rem; color: #94a3b8; }
    .prop-val { font-size: 0.85rem; font-weight: 600; color: #f8fafc; background: #0f172a; padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid #334155; }
    .editor-footer-toolbar { height: 36px; background: #1e293b; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>
  <!-- Vendor Controls (Targeted for hiding) -->
  <div class="vendor-top-bar h-12 bg-gradient-to-r from-slate-800 to-slate-700 flex items-center px-4 gap-2">
    <a class="flex items-center gap-1" href="#projects">Projects</a>
    <span class="inline-grid shrink-0">Saved ✓</span>
    <div class="relative">
      <button type="button">Export</button>
    </div>
    <button type="button" class="bg-white text-slate-800 font-semibold">Save</button>
  </div>

  <!-- Editor Panels (Must Remain Fully Visible) -->
  <div class="editor-workspace" data-editor-panel="true">
    <aside class="editor-sidebar catalog" data-editor-panel="true" aria-label="Tool Catalog">
      <div class="sidebar-title">Drawing Tools</div>
      <button type="button" class="tool-btn active"><span>✏️</span> Wall Tool</button>
      <button type="button" class="tool-btn"><span>📐</span> Room Polygon</button>
      <button type="button" class="tool-btn"><span>🚪</span> Door & Window</button>
      <div class="sidebar-title" style="margin-top: 0.5rem;">Catalog</div>
      <button type="button" class="tool-btn"><span>🛋️</span> Living Furniture</button>
      <button type="button" class="tool-btn"><span>🪑</span> Dining & Chairs</button>
    </aside>

    <main class="editor-viewport" data-editor-panel="true">
      <div class="viewport-overlay">
        <div class="overlay-badge">Grid: 10cm</div>
        <div class="overlay-badge">View: 2D Plan</div>
      </div>
      <div class="canvas-container">
        <svg class="editor-canvas" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Mock floor plan polygon and walls -->
          <polygon points="120,80 480,80 480,320 120,320" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="2" />
          <line x1="120" y1="80" x2="480" y2="80" stroke="#f8fafc" stroke-width="8" stroke-linecap="square" />
          <line x1="480" y1="80" x2="480" y2="320" stroke="#f8fafc" stroke-width="8" stroke-linecap="square" />
          <line x1="480" y1="320" x2="120" y2="320" stroke="#f8fafc" stroke-width="8" stroke-linecap="square" />
          <line x1="120" y1="320" x2="120" y2="80" stroke="#f8fafc" stroke-width="8" stroke-linecap="square" />
          <!-- Door cutout -->
          <line x1="260" y1="320" x2="340" y2="320" stroke="#3b82f6" stroke-width="4" stroke-dasharray="6,4" />
          <path d="M 260 320 A 80 80 0 0 1 340 240" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" />
          <text x="300" y="200" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">Living Room</text>
          <text x="300" y="222" fill="#94a3b8" font-size="12" text-anchor="middle">150.00 sq ft</text>
        </svg>
      </div>
      <div class="editor-footer-toolbar toolbar" data-editor-panel="true">
        <span>Snap: Active (1cm)</span>
        <span>Cursor: (365.76cm, 381.00cm)</span>
        <span>Zoom: 100%</span>
      </div>
    </main>

    <aside class="editor-properties panel" data-editor-panel="true" aria-label="Properties">
      <div class="sidebar-title">Room Properties</div>
      <div class="prop-row">
        <span class="prop-label">Selected Entity</span>
        <span class="prop-val">Living Room</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Area (Calculated)</span>
        <span class="prop-val">150.00 sq ft</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Perimeter</span>
        <span class="prop-val">49.00 lf</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Wall Height</span>
        <span class="prop-val">8.00 ft</span>
      </div>
    </aside>
  </div>
  <script>
    document.documentElement.classList.add('zanini-hosted-openplan3d');
    OpenPlan3DEditorBridge.installStorageLock();
    window.__openPlan3DSession = OpenPlan3DEditorBridge.createSession();
    OpenPlan3DEditorBridge.startHidingNativeSaveUi(document);
    window.addEventListener('message', function (event) {
      window.__openPlan3DSession.handleParentMessage(event);
    });

    var params = new URLSearchParams(window.location.search);
    window.__store = {
      value: { id: 'untitled', name: 'Untitled Project', floors: [{ walls: [], rooms: [] }] },
      listeners: [],
      subscribe: function (cb) {
        this.listeners.push(cb);
        cb(this.value);
        return function () {};
      },
      set: function (v) {
        this.value = v;
        this.listeners.forEach(function (cb) { cb(v); });
      }
    };

    if (params.get('missing') === '1') {
      window.__openPlan3DSession.attachStore({});
    } else {
      window.__openPlan3DSession.attachStore({
        H: function (project) { window.__store.set(project); },
        c: window.__store
      });
    }
  </script>
</body>
</html>
