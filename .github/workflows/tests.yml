            tests/Feature/Admin/AdminHotkeySaveMarkerTest.php
            tests/Feature/Admin/AdminOnceSubmitReplayTest.php
            tests/Feature/Admin/AdminHotkeySaveMarkupTest.php
            tests/Unit/Services/RoomAreaFinishMathTest.php
            tests/Feature/Admin/RoomAreaBatch2PageTest.php
            tests/Feature/SharedPricesLayoutTest.php
            tests/Feature/AdminMoneyDirectEntryTest.php
            tests/Feature/SharedPricesTest.php
            tests/Feature/SharedPricesAddRenameTest.php
            tests/Feature/SharedWorksNormalizedLabelMigrationTest.php
            tests/Feature/SharedPricesParallelSaveTest.php
            tests/Unit/Models/SharedWorkLabelTest.php
            tests/Unit/Services/SharedWorkCatalogTest.php
            tests/Unit/Services/FlooringQuotationCalculatorTest.php
            tests/Unit/Services/RoomAreaFormulaParserTest.php
            tests/Feature/Admin/RoomAreaBatch3PageTest.php
