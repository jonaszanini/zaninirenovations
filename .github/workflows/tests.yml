name: Tests

permissions:
  contents: read
  pull-requests: read

# GitHub bills runner minutes. Superseded PR runs cancel unless the ref is main.
# Heavy geometry/fuzz checks run when related paths change (including on main).

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      slow:
        description: Run the millwork 3k fuzz and live layout checks
        required: false
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_database: ${{ steps.flags.outputs.run_database }}
      run_browser: ${{ steps.flags.outputs.run_browser }}
      run_browser_admin: ${{ steps.flags.outputs.run_browser_admin }}
      run_browser_openplan3d: ${{ steps.flags.outputs.run_browser_openplan3d }}
      run_browser_quotation: ${{ steps.flags.outputs.run_browser_quotation }}
      run_browser_client: ${{ steps.flags.outputs.run_browser_client }}
      run_mysql_node: ${{ steps.flags.outputs.run_mysql_node }}
      run_shared_prices_geometry: ${{ steps.flags.outputs.run_shared_prices_geometry }}
      run_room_area_live: ${{ steps.flags.outputs.run_room_area_live }}
      run_blog_live: ${{ steps.flags.outputs.run_blog_live }}
      run_millwork_fuzz: ${{ steps.flags.outputs.run_millwork_fuzz }}
      filter_shared_prices: ${{ steps.flags.outputs.filter_shared_prices }}
      filter_room_area: ${{ steps.flags.outputs.filter_room_area }}
      filter_blog: ${{ steps.flags.outputs.filter_blog }}
      filter_seo: ${{ steps.flags.outputs.filter_seo }}
      filter_millwork: ${{ steps.flags.outputs.filter_millwork }}
      filter_quotation: ${{ steps.flags.outputs.filter_quotation }}
      filter_routes_smoke: ${{ steps.flags.outputs.filter_routes_smoke }}
      broad_run: ${{ steps.flags.outputs.broad_run }}
      global_test_deps: ${{ steps.flags.outputs.global_test_deps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: tests/ci/classify-ci-changes.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!lang/**'
            global_test_deps:
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'phpunit.xml'
              - 'phpunit.*.xml'
              - '.github/workflows/**'
              - 'tests/ci/**'
              - 'config/**'
              - 'bootstrap/**'
              - 'app/Providers/**'
              - 'database/migrations/**'
              - 'resources/views/layouts/**'
            admin_shell:
              - 'resources/views/admin/layouts/app.blade.php'
            shared_prices_geometry:
              - 'app/Http/Controllers/Admin/BasementDatabaseController.php'
              - 'app/Http/Controllers/Admin/BasementMaterialPriceSyncController.php'
              - 'app/Http/Controllers/Admin/SharedPriceLibraryController.php'
              - 'app/Models/Material.php'
              - 'app/Models/SharedWork.php'
              - 'app/Services/BasementMaterialPriceSyncScope.php'
              - 'app/Services/MaterialScraping/MaterialPriceSyncService.php'
              - 'app/Services/MaterialScraping/SteppedMaterialPriceSync.php'
              - 'app/Services/SharedWorkCatalog.php'
              - 'app/Support/MaterialPriceSyncedAtDisplay.php'
              - 'public/css/admin-materials.css'
              - 'public/js/admin-basement-material-sync.js'
              - 'public/js/shared-prices-effective.js'
              - 'resources/views/admin/partials/basement_material_price_sync.blade.php'
              - 'resources/views/admin/quotations/basement/**'
              - 'resources/views/admin/quotations/shared_prices/**'
              - 'resources/views/components/admin/material-price-sync-age.blade.php'
              - 'tests/Feature/SharedPrices*.php'
              - 'tests/Feature/Admin/BasementMaterialPriceSyncTest.php'
              - 'tests/js/shared-prices*.test.js'
              - 'tests/Unit/Models/SharedWorkLabelTest.php'
              - 'tests/Unit/Services/BasementMaterialPriceSyncScopeTest.php'
              - 'tests/Unit/Services/SharedWorkCatalogTest.php'
              - 'tests/Unit/Services/SharedWorkCatalogMaterialPriceTest.php'
              - 'tests/Unit/Services/BasementQuotationProductivityOverlayTest.php'
              - 'tests/Unit/Support/MaterialPriceSyncedAtDisplayTest.php'
              - 'app/Services/BasementQuotationCalculator.php'
              - 'app/Services/TrimmingQuotationCalculator.php'
              - 'tests/Unit/Services/TrimmingQuotationCalculatorTest.php'
            room_area_live:
              - 'app/**/RoomArea*.php'
              - 'app/Services/OpenPlan3DMeasurementBridge.php'
              - 'app/Services/OpenPlan3DPlanValidator.php'
              - 'database/seeders/RoomAreaGeometrySeeder.php'
              - 'public/js/room-area/**'
              - 'public/js/openplan3d-measurement-bridge.js'
              - 'resources/views/**/room-area/**'
              - 'resources/views/admin/client-projects/**/room-area/**'
              - 'resources/views/admin/utilities/_room_area_openplan3d.blade.php'
              - 'tests/Feature/Admin/RoomArea*.php'
              - 'tests/Feature/Admin/*RoomArea*.php'
              - 'tests/Feature/Admin/RoomAreaEngineFeatureFlagTest.php'
              - 'tests/js/openplan3d-room-area-blade-browser.test.js'
              - 'tests/js/openplan3d-takeoffs-panel-browser.test.js'
              - 'tests/js/room-area-main-thread-responsive.test.js'
              - 'tests/js/room-area-phone-geometry.test.js'
              - 'public/js/openplan3d-editor-bridge.js'
              - 'public/js/openplan3d-hosted-locale.js'
              - 'scripts/patch-openplan3d.mjs'
              - 'scripts/openplan3d-h1.json'
              - 'public/vendor/openplan3d-h1/**'
              - 'tests/js/openplan3d-editor-index-mount.test.js'
              - 'public/.htaccess'
              - 'tests/ci/apache-htaccess-cache.sh'
              - 'tests/js/openplan3d-editor-asset-version.test.js'
              - 'public/js/openplan3d-host.js'
              - 'public/vendor/openplan3d-h1/editor/index.html'
              - 'tests/Unit/Services/RoomArea*.php'
            blog_live:
              - 'app/**/BlogPost*.php'
              - 'database/seeders/BlogPostsGeometrySeeder.php'
              - 'resources/views/**/blog/**'
              - 'resources/views/admin/blog/**'
              - 'tests/Feature/Admin/BlogPosts*.php'
              - 'tests/Feature/Admin/blog-posts-geometry.js'
              - 'tests/Feature/Blog*.php'
            millwork_fuzz:
              - 'app/Services/Millwork/**'
              - 'tests/Unit/Services/MillworkV2FuzzParityTest.php'
              - 'tests/Unit/Services/Millwork*.php'
              - 'tests/Feature/Admin/Millwork*.php'
            browser_js:
              - 'tests/js/*browser*'
              - 'tests/js/**/*browser*'
              - 'tests/js/admin-info-tip-click.test.mjs'
            browser_admin:
              - 'public/js/admin-**'
              - 'public/js/admin*.js'
              - 'public/css/admin-**'
              - 'resources/views/admin/layouts/**'
              - 'resources/views/admin/partials/**'
              - 'resources/views/components/admin/info-tip.blade.php'
              - 'tests/js/admin-*'
              - 'tests/js/**/*admin*browser*'
            browser_openplan3d:
              - 'public/js/openplan3d-**'
              - 'public/js/room-area/**'
              - 'public/vendor/openplan3d-h1/**'
              - 'scripts/patch-openplan3d.mjs'
              - 'scripts/openplan3d-h1.json'
              - 'app/Services/OpenPlan3DMeasurementBridge.php'
              - 'app/Services/OpenPlan3DPlanValidator.php'
              - 'resources/views/admin/utilities/_room_area_openplan3d.blade.php'
              - 'tests/js/openplan3d-**'
              - 'tests/js/room-area-**'
            browser_quotation:
              - 'app/Support/Quotation**.php'
              - 'app/Models/ClientProjectQuotation.php'
              - 'app/Support/Quotations/**'
              - 'resources/views/admin/quotations/**'
              - 'resources/views/admin/partials/quotation_editor_*.blade.php'
              - 'resources/views/components/admin/info-tip.blade.php'
              - 'public/js/*quotation*'
              - 'public/js/admin-hotkey-save.js'
              - 'public/js/admin-toast.js'
              - 'public/js/admin-dialog.js'
              - 'public/js/admin-info-tip.js'
              - 'public/css/admin.css'
              - 'tests/js/quotation-**'
              - 'tests/js/fixtures/quotation-redraft-hotkey-lock.html'
              - 'tests/Feature/Admin/QuotationPublishEditReopenPdfTest.php'
              - 'tests/Feature/Admin/QuotationLifecycleBrowserTest.php'
              - 'tests/Feature/Admin/quotation-lifecycle-browser.js'
            browser_client:
              - 'resources/views/admin/client-projects/**'
              - 'resources/views/admin/client_projects/**'
              - 'public/js/admin-client-projects.js'
              - 'public/css/admin-client-projects.css'
              - 'public/css/admin-dark.css'
              - 'tests/js/client-projects-**'
            routes_smoke:
              - 'routes/**'
              - 'app/Http/Controllers/**'
              - 'app/Providers/RouteServiceProvider.php'
            seo:
              - 'resources/views/site/**'
              - 'resources/views/partials/**'
              - 'resources/views/pagination/**'
              - 'resources/views/emails/**'
              - 'config/service_areas.php'
              - 'config/public_services.php'
              - 'app/Support/Seo*.php'
              - 'app/Support/PublicSitemap.php'
              - 'app/Support/LlmsTxtGenerator.php'
              - 'app/Support/RobotsTxtGenerator.php'
              - 'tests/Feature/OnPageSeo*.php'

      - id: flags
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLOW_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slow || 'false' }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          HAS_CODE_CHANGES: ${{ steps.classify.outputs.has_code_changes }}
          CHANGED_FILES_FILE: ${{ steps.classify.outputs.changed_files_path }}
          FILTER_GLOBAL: ${{ steps.filter.outputs.global_test_deps }}
          FILTER_ADMIN_SHELL: ${{ steps.filter.outputs.admin_shell }}
          FILTER_SP: ${{ steps.filter.outputs.shared_prices_geometry }}
          FILTER_RA: ${{ steps.filter.outputs.room_area_live }}
          FILTER_BL: ${{ steps.filter.outputs.blog_live }}
          FILTER_MF: ${{ steps.filter.outputs.millwork_fuzz }}
          FILTER_BROWSER_JS: ${{ steps.filter.outputs.browser_js }}
          FILTER_BROWSER_ADMIN: ${{ steps.filter.outputs.browser_admin }}
          FILTER_BROWSER_OPENPLAN3D: ${{ steps.filter.outputs.browser_openplan3d }}
          FILTER_BROWSER_QUOTATION: ${{ steps.filter.outputs.browser_quotation }}
          FILTER_BROWSER_CLIENT: ${{ steps.filter.outputs.browser_client }}
          FILTER_ROUTES: ${{ steps.filter.outputs.routes_smoke }}
          FILTER_SEO: ${{ steps.filter.outputs.seo }}
        run: bash tests/ci/compute-ci-flags.sh

  unit_js:
    needs: changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # QuotationEditorControlInventoryTest git-shows pinned SHA 86e68a3e.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_mysql, fileinfo, intl
          coverage: none
          cache: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-fund --no-audit

      - name: Cache Puppeteer
        if: needs.changes.outputs.run_browser == 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-24.43.1

      - name: Apache .htaccess cache headers
        run: tests/ci/apache-htaccess-cache.sh

      - name: JavaScript tests (no browser)
        run: tests/ci/run-js-unit-suite.sh

      - name: Unit tests (no database)
        run: tests/ci/run-unit-suite.sh

      - name: Install Puppeteer browser
        if: needs.changes.outputs.run_browser == 'true'
        run: npx puppeteer browsers install chrome

      - name: JavaScript tests (browser)
        if: needs.changes.outputs.run_browser == 'true'
        env:
          CI_JS_BROWSER_ALL: ${{ needs.changes.outputs.global_test_deps == 'true' && 'true' || 'false' }}
          CI_JS_BROWSER_ADMIN: ${{ needs.changes.outputs.run_browser_admin }}
          CI_JS_BROWSER_OPENPLAN3D: ${{ needs.changes.outputs.run_browser_openplan3d }}
          CI_JS_BROWSER_QUOTATION: ${{ needs.changes.outputs.run_browser_quotation }}
          CI_JS_BROWSER_CLIENT: ${{ needs.changes.outputs.run_browser_client }}
        run: tests/ci/run-js-browser-suite.sh

      - name: Upload room area takeoffs panel screenshots
        if: success() && needs.changes.outputs.run_browser_openplan3d == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: room-area-takeoffs-panel-screenshots
          path: |
            tests/js/artifacts/room-area-takeoffs-panel-1280.png
            tests/js/artifacts/room-area-takeoffs-panel-390.png
          if-no-files-found: warn

      - name: Upload wall finishes drywall panel screenshots
        if: success() && needs.changes.outputs.run_browser_openplan3d == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: room-area-wall-finishes-drywall-screenshots
          path: |
            storage/app/qa-screenshots/room-area-wall-finishes-drywall-1280.png
            storage/app/qa-screenshots/room-area-wall-finishes-drywall-390.png
          if-no-files-found: warn

      - name: Upload quotation row actions menu screenshots
        if: success() && needs.changes.outputs.run_browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quotation-row-actions-menu-screenshots
          path: |
            tests/js/artifacts/quotation-row-actions-menu-390.png
            tests/js/artifacts/quotation-row-actions-menu-1280.png
            storage/app/qa-screenshots/quotation-row-actions-menu-390.png
            storage/app/qa-screenshots/quotation-row-actions-menu-1280.png
          if-no-files-found: warn

  mysql:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.run_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zanini_renovations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_mysql, fileinfo, intl
          coverage: none
          cache: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        if: needs.changes.outputs.run_mysql_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        if: needs.changes.outputs.run_mysql_node == 'true'
        run: npm ci --no-fund --no-audit

      - name: Cache Puppeteer
        if: needs.changes.outputs.run_mysql_node == 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-24.43.1

      - name: Database tests (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_renovations_test
          DB_USERNAME: root
          DB_PASSWORD: root
          QUOTE_ACCEPT_API_TOKEN: ci-quote-accept-token
          ETRANSFER_API_TOKEN: ci-etransfer-token
          CI_MYSQL_SUITE: ${{ github.ref == 'refs/heads/main' && 'full' || 'pr' }}
          CI_MYSQL_FILTER_SHARED_PRICES: ${{ needs.changes.outputs.filter_shared_prices }}
          CI_MYSQL_FILTER_ROOM_AREA: ${{ needs.changes.outputs.filter_room_area }}
          CI_MYSQL_FILTER_BLOG: ${{ needs.changes.outputs.filter_blog }}
          CI_MYSQL_FILTER_SEO: ${{ needs.changes.outputs.filter_seo }}
          CI_MYSQL_FILTER_MILLWORK: ${{ needs.changes.outputs.filter_millwork }}
          CI_MYSQL_FILTER_QUOTATION: ${{ needs.changes.outputs.filter_quotation }}
          CI_MYSQL_FILTER_ROUTES_SMOKE: ${{ needs.changes.outputs.filter_routes_smoke }}
        run: tests/ci/run-database-suite.sh

      - name: Upload basement wizard QA screenshots
        if: success() && needs.changes.outputs.filter_quotation == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: basement-wizard-qa-screenshots
          path: storage/app/qa-screenshots/basement-*.png
          if-no-files-found: warn

      - name: Upload Shared prices geometry
        if: success() && needs.changes.outputs.run_shared_prices_geometry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shared-prices-geometry
          path: |
            storage/app/sp-layout-geometry.json
            storage/app/sp-layout-1100.png
            storage/app/sp-add-unit-1100.png
            storage/app/sp-shared-prices-1280-dark.png
            storage/app/sp-shared-prices-390-dark.png
          if-no-files-found: warn

      - name: Millwork v2 fuzz invariants
        if: success() && needs.changes.outputs.run_millwork_fuzz == 'true'
        env:
          MILLWORK_FUZZ_CASES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slow == 'true' && '3000' || '200' }}
        run: php artisan test tests/Unit/Services/MillworkV2FuzzParityTest.php

      - name: Room Area live layout geometry
        if: success() && needs.changes.outputs.run_room_area_live == 'true'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_ra_geometry
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_URL: http://127.0.0.1:8001
          RA_LIVE: '1'
          RA_LIVE_ONLY: '1'
          RA_LIVE_URL: http://127.0.0.1:8001
        run: |
          php -r "(new PDO('mysql:host=127.0.0.1', 'root', 'root'))->exec('CREATE DATABASE IF NOT EXISTS zanini_ra_geometry');"
          php artisan migrate --force
          php artisan db:seed --class=RoomAreaGeometrySeeder --force
          php artisan serve --host=127.0.0.1 --port=8001 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/admin/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/admin/login >/dev/null
          node tests/js/room-area-phone-geometry.test.js

      - name: Blog posts live layout geometry
        if: success() && needs.changes.outputs.run_blog_live == 'true'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_blog_geometry
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_URL: http://127.0.0.1:8000
          GEOMETRY_LIVE: '1'
        run: |
          php -r "(new PDO('mysql:host=127.0.0.1', 'root', 'root'))->exec('CREATE DATABASE IF NOT EXISTS zanini_blog_geometry');"
          php artisan migrate --force
          php artisan db:seed --class=BlogPostsGeometrySeeder --force
          php artisan serve --host=127.0.0.1 --port=8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/admin/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/admin/login >/dev/null
          node tests/Feature/Admin/blog-posts-geometry.js
