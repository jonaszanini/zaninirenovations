name: Tests

# GitHub bills runner minutes. Superseded PR runs cancel unless the ref is main.
# Heavy geometry/fuzz checks run on every main push; on PRs only when related paths change.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      slow:
        description: Run the millwork 3k fuzz and live layout checks
        required: false
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_database: ${{ steps.flags.outputs.run_database }}
      run_browser: ${{ steps.flags.outputs.run_browser }}
      run_shared_prices_geometry: ${{ steps.flags.outputs.run_shared_prices_geometry }}
      run_room_area_live: ${{ steps.flags.outputs.run_room_area_live }}
      run_blog_live: ${{ steps.flags.outputs.run_blog_live }}
      run_millwork_fuzz: ${{ steps.flags.outputs.run_millwork_fuzz }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!lang/**'
            shared_prices_geometry:
              - 'app/Http/Controllers/Admin/SharedPriceLibraryController.php'
              - 'app/Models/SharedWork.php'
              - 'app/Services/SharedWorkCatalog.php'
              - 'public/js/shared-prices-effective.js'
              - 'resources/views/admin/quotations/shared_prices/**'
              - 'tests/Feature/SharedPrices*.php'
              - 'tests/js/shared-prices*.test.js'
              - 'tests/Unit/Models/SharedWorkLabelTest.php'
              - 'tests/Unit/Services/SharedWorkCatalogTest.php'
            room_area_live:
              - 'app/**/RoomArea*.php'
              - 'database/seeders/RoomAreaGeometrySeeder.php'
              - 'public/js/room-area/**'
              - 'resources/views/**/room-area/**'
              - 'resources/views/admin/client-projects/**/room-area/**'
              - 'tests/Feature/Admin/RoomArea*.php'
              - 'tests/Feature/Admin/*RoomArea*.php'
              - 'tests/js/room-area-phone-geometry.test.js'
              - 'tests/Unit/Services/RoomArea*.php'
            blog_live:
              - 'app/**/BlogPost*.php'
              - 'database/seeders/BlogPostsGeometrySeeder.php'
              - 'resources/views/**/blog/**'
              - 'resources/views/admin/blog/**'
              - 'tests/Feature/Admin/BlogPosts*.php'
              - 'tests/Feature/Admin/blog-posts-geometry.js'
              - 'tests/Feature/Blog*.php'
            millwork_fuzz:
              - 'app/Services/Millwork/**'
              - 'tests/Unit/Services/MillworkV2FuzzParityTest.php'
              - 'tests/Unit/Services/Millwork*.php'
              - 'tests/Feature/Admin/Millwork*.php'
            browser_js:
              - 'tests/js/*browser*'
              - 'tests/js/**/*browser*'
              - 'tests/js/admin-info-tip-click.test.mjs'

      - id: flags
        env:
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_SP: ${{ steps.filter.outputs.shared_prices_geometry }}
          FILTER_RA: ${{ steps.filter.outputs.room_area_live }}
          FILTER_BL: ${{ steps.filter.outputs.blog_live }}
          FILTER_MF: ${{ steps.filter.outputs.millwork_fuzz }}
          FILTER_BROWSER_JS: ${{ steps.filter.outputs.browser_js }}
        run: |
          set -euo pipefail
          is_main=false
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then is_main=true; fi
          slow_input=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.slow }}" = "true" ]; then slow_input=true; fi

          run_database=false
          if [ "$is_main" = true ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then run_database=true; fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$FILTER_CODE" = "true" ]; then run_database=true; fi

          run_shared=false
          if [ "$is_main" = true ] || [ "$slow_input" = true ] || [ "$FILTER_SP" = "true" ]; then run_shared=true; fi
          run_ra=false
          if [ "$is_main" = true ] || [ "$slow_input" = true ] || [ "$FILTER_RA" = "true" ]; then run_ra=true; fi
          run_bl=false
          if [ "$is_main" = true ] || [ "$slow_input" = true ] || [ "$FILTER_BL" = "true" ]; then run_bl=true; fi
          run_mf=false
          if [ "$is_main" = true ] || [ "$slow_input" = true ] || [ "$FILTER_MF" = "true" ]; then run_mf=true; fi

          run_browser=false
          if [ "$is_main" = true ] || [ "$run_database" = true ] || [ "$slow_input" = true ]; then run_browser=true; fi
          if [ "$FILTER_SP" = "true" ] || [ "$FILTER_RA" = "true" ] || [ "$FILTER_BL" = "true" ] || [ "$FILTER_MF" = "true" ] || [ "$FILTER_BROWSER_JS" = "true" ]; then run_browser=true; fi

          {
            echo "run_database=$run_database"
            echo "run_browser=$run_browser"
            echo "run_shared_prices_geometry=$run_shared"
            echo "run_room_area_live=$run_ra"
            echo "run_blog_live=$run_bl"
            echo "run_millwork_fuzz=$run_mf"
          } >> "$GITHUB_OUTPUT"

  unit_js:
    needs: changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # QuotationEditorControlInventoryTest git-shows pinned SHA 86e68a3e.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_mysql, fileinfo, intl
          coverage: none
          cache: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-fund --no-audit

      - name: Cache Puppeteer
        if: needs.changes.outputs.run_browser == 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-24.43.1

      - name: JavaScript tests (no browser)
        run: |
          node tests/js/room-area-lib.test.js
          node tests/js/openplan3d-parity.test.js
          node tests/js/openplan3d-editor-bridge.test.js
          node tests/js/room-area-formula.test.js
          node tests/js/shared-prices-effective.test.js
          node tests/js/admin-hotkey-save.test.js
          node tests/js/admin-project-calendar-swipe.test.js
          node tests/js/admin-info-tip.test.mjs

      - name: JavaScript tests (browser)
        if: needs.changes.outputs.run_browser == 'true'
        run: |
          node tests/js/openplan3d-browser.test.js
          node tests/js/openplan3d-editor-browser.test.js
          node tests/js/admin-hotkey-save-browser.test.js
          node tests/js/admin-date-picker-browser.test.js
          node tests/js/quotation-redraft-confirm-browser.test.js
          node tests/js/quotation-redraft-hotkey-lock-browser.test.js
          node tests/js/admin-info-tip-click.test.mjs

      - name: Unit tests (no database)
        run: |
          set -euo pipefail
          files=(
            tests/Unit/Services/OpenPlan3DParityTest.php
            tests/Unit/Services/OpenPlan3DPlanValidatorTest.php
            tests/Unit/Github/DeployDependsOnTestsTest.php
            tests/Unit/Views/BladeSyntaxTest.php
            tests/Unit/Views/AiActionGroupTest.php
            tests/Unit/Views/QuotationPdfPageBreakTest.php
            tests/Unit/BasementQuotationWizardViewTest.php
            tests/Unit/Models/BasementQuotationScopePdfTest.php
            tests/Unit/Support/AdminListFiltersTest.php
            tests/Unit/Support/CadMoneyTest.php
            tests/Unit/Support/AdminOnceSubmitTokenTest.php
            tests/Unit/Support/QuotationSaveIntentTest.php
            tests/Unit/Support/QuotationDraftFlashTest.php
            tests/Unit/Services/HomeDepotCaUrlsTest.php
            tests/Unit/Services/SupplierWebsiteDataExtractorTest.php
            tests/Unit/Services/SupplierWebsiteDataExtractorAddressCapTest.php
            tests/Unit/Services/SupplierWebsiteDataExtractorGoogleMapsAddressTest.php
            tests/Unit/Services/SupplierWebsiteDataExtractorAddressFinalizeTest.php
            tests/Unit/Services/SupplierWebsiteDataExtractorLogoUrlTest.php
            tests/Unit/Services/SupplierWebsiteDataExtractorTagsTest.php
            tests/Unit/Services/SupplierWebsiteImportServiceTest.php
            tests/Unit/Views/AdminInfoTipTest.php
            tests/Unit/Views/AdminInfoTipBehaviourTest.php
            tests/Unit/Views/AdminInfoTipIdIsolationTest.php
            tests/Unit/Views/AdminInfoTipCallerContractTest.php
            tests/Unit/Views/FencePriceBannerTipTest.php
            tests/Unit/Services/CutOptimizerEngineTest.php
            tests/Unit/Services/MillworkCutPlanPlacementTest.php
            tests/Unit/Services/Millwork/MillworkDimensionParserTest.php
            tests/Unit/Services/MillworkSavedQuoteMainFixtureTest.php
            tests/Unit/Services/MillworkCalcVersionGateTest.php
            tests/Unit/Views/AdminDarkThemeCoverageTest.php
            tests/Unit/Views/AdminDatePickerThemeTest.php
            tests/Unit/Views/ClientProjectUtilitiesDarkThemeTest.php
            tests/Unit/Views/QuotationEditorHeaderMarkupTest.php
            tests/Unit/Views/PublicCssLightOnlyTest.php
            tests/Unit/Views/PublicMobileNavDropdownTest.php
            tests/Unit/Views/PublicLayoutExcludesAdminHotkeySaveTest.php
            tests/Unit/Views/HomeKitchenTileImageTest.php
          )
          failed=()
          for f in "${files[@]}"; do
            php artisan test "$f" || failed+=("$f")
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'Failed PHPUnit paths:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

  mysql:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.run_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zanini_renovations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_mysql, fileinfo, intl
          coverage: none
          cache: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        if: needs.changes.outputs.run_browser == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        if: needs.changes.outputs.run_browser == 'true'
        run: npm ci --no-fund --no-audit

      - name: Cache Puppeteer
        if: needs.changes.outputs.run_browser == 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-24.43.1

      - name: Database tests (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_renovations_test
          DB_USERNAME: root
          DB_PASSWORD: root
          QUOTE_ACCEPT_API_TOKEN: ci-quote-accept-token
          ETRANSFER_API_TOKEN: ci-etransfer-token
          SKIP_SHARED_PRICES_LAYOUT: ${{ github.ref != 'refs/heads/main' && needs.changes.outputs.run_shared_prices_geometry != 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          files=(
