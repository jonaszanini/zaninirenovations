name: Tests

# GitHub bills runner minutes. A push to an open pull request used to start
# this workflow twice, and a newer push did not cancel the run it replaced.
# The millwork fuzz and live layout checks run only from a manual dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: Run the millwork 3k fuzz and live layout checks
        required: false
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zanini_renovations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_mysql, fileinfo, intl
          coverage: none
          cache: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-24.43.1

      - name: Install Node dependencies
        run: npm ci --no-fund --no-audit

      - name: JavaScript tests
        run: |
          node tests/js/room-area-lib.test.js
          node tests/js/openplan3d-parity.test.js
          node tests/js/openplan3d-editor-bridge.test.js
          node tests/js/openplan3d-browser.test.js
          node tests/js/openplan3d-editor-browser.test.js
          node tests/js/room-area-formula.test.js
          node tests/js/shared-prices-effective.test.js
          node tests/js/admin-hotkey-save.test.js
          node tests/js/admin-hotkey-save-browser.test.js
          node tests/js/admin-date-picker-browser.test.js
          node tests/js/quotation-redraft-confirm-browser.test.js
          node tests/js/quotation-redraft-hotkey-lock-browser.test.js
          node tests/js/admin-info-tip.test.mjs
          node tests/js/admin-info-tip-click.test.mjs

      - name: Unit tests (no database)
        run: |
          set -euo pipefail
          files=(
            tests/Unit/Services/OpenPlan3DParityTest.php
            tests/Unit/Github/DeployDependsOnTestsTest.php
            tests/Unit/Services/RoomAreaDrawingImporterTest.php
            tests/Unit/Views/BladeSyntaxTest.php
            tests/Unit/Views/AiActionGroupTest.php
            tests/Unit/Views/QuotationPdfPageBreakTest.php
            tests/Unit/BasementQuotationWizardViewTest.php
            tests/Unit/Models/BasementQuotationScopePdfTest.php
            tests/Unit/Support/AdminListFiltersTest.php
            tests/Unit/Support/CadMoneyTest.php
            tests/Unit/Support/AdminOnceSubmitTokenTest.php
            tests/Unit/Support/QuotationSaveIntentTest.php
            tests/Unit/Support/QuotationDraftFlashTest.php
            tests/Unit/Services/HomeDepotCaUrlsTest.php
            tests/Unit/Views/AdminInfoTipTest.php
            tests/Unit/Views/AdminInfoTipBehaviourTest.php
            tests/Unit/Views/AdminInfoTipIdIsolationTest.php
            tests/Unit/Views/AdminInfoTipCallerContractTest.php
            tests/Unit/Views/FencePriceBannerTipTest.php
            tests/Unit/Services/CutOptimizerEngineTest.php
            tests/Unit/Services/MillworkCutPlanPlacementTest.php
            tests/Unit/Services/Millwork/MillworkDimensionParserTest.php
            tests/Unit/Services/MillworkSavedQuoteMainFixtureTest.php
            tests/Unit/Services/MillworkCalcVersionGateTest.php
            tests/Unit/Views/AdminDarkThemeCoverageTest.php
            tests/Unit/Views/AdminDatePickerThemeTest.php
            tests/Unit/Views/ClientProjectUtilitiesDarkThemeTest.php
            tests/Unit/Views/QuotationEditorHeaderMarkupTest.php
            tests/Unit/Views/PublicCssLightOnlyTest.php
            tests/Unit/Views/PublicMobileNavDropdownTest.php
            tests/Unit/Views/PublicLayoutExcludesAdminHotkeySaveTest.php
            tests/Unit/Views/HomeKitchenTileImageTest.php
          )
          failed=()
          for f in "${files[@]}"; do
            php artisan test "$f" || failed+=("$f")
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'Failed PHPUnit paths:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Database tests (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_renovations_test
          DB_USERNAME: root
          DB_PASSWORD: root
          QUOTE_ACCEPT_API_TOKEN: ci-quote-accept-token
          ETRANSFER_API_TOKEN: ci-etransfer-token
        run: |
          set -euo pipefail
          files=(
            tests/Feature/Smoke
            tests/Feature/QuoteAcceptance
            tests/Unit/Services/EtransferNoticeParserTest.php
            tests/Unit/Services/EtransferInvoiceMatcherTest.php
            tests/Feature/Etransfer
            tests/Feature/Invoices/MarkPaidInvoiceTest.php
            tests/Feature/Admin/GlobalFinancialsTest.php
            tests/Feature/Admin/GlobalSearchApiTest.php
            tests/Feature/Admin/QuickStatusChangeTest.php
            tests/Feature/DuplicateQuotationTest.php
            tests/Feature/ExpenseAmountParsingTest.php
            tests/Feature/Invoices/HourlyInvoiceUpdateTest.php
            tests/Feature/Admin/DashboardActionFirstLayoutTest.php
            tests/Feature/Admin/CancelledProjectInvoiceExclusionTest.php
            tests/Feature/Admin/ClientIndexAddressSearchTest.php
            tests/Feature/Admin/ClientProjectFiltersAccordionTest.php
            tests/Feature/Admin/RoomAreaEngineFeatureFlagTest.php
            tests/Feature/Admin/RoomAreaOpenPlan3DSaveTest.php
            tests/Feature/Admin/RoomAreaOpenPlan3DQuotationTest.php
            tests/Unit/Services/RoomAreaCanvasDataTest.php
            tests/Feature/Admin/RoomAreaCanvasObjectsTest.php
            tests/Feature/Admin/RoomAreaPdfExportTest.php
            tests/Feature/Admin/BasementRoomAreaImportTest.php
            tests/Feature/Admin/BasementQuotationMathRoundTripTest.php
            tests/Feature/Admin/BasementQuotationPagesTest.php
            tests/Feature/Admin/QuotationEditorHeaderTest.php
            tests/Feature/Admin/QuotationHotkeySaveStateTest.php
            tests/Feature/Admin/QuotationDraftOptionalFieldsTest.php
            tests/Feature/Admin/QuotationDraftClientFacingGuardTest.php
            tests/Feature/Admin/QuotationEditorControlInventoryTest.php
            tests/Unit/Services/RoomAreaQuoteQuantitiesTest.php
            tests/Feature/Admin/RoomAreaQuoteLinesTest.php
            tests/Unit/Services/RoomAreaQuotePrefillTest.php
            tests/Feature/Admin/RoomAreaQuotePrefillTest.php
            tests/Unit/Services/RoomAreaSharedWallsTest.php
            tests/Unit/Services/RoomAreaMeasurementParserTest.php
            tests/Unit/Services/RoomAreaClosingErrorTest.php
            tests/Feature/Admin/RoomAreaPhotosTest.php
            tests/Feature/Admin/ClientProjectRoomAreaPageTest.php
            tests/Feature/Admin/UtilitiesRoomAreaPageTest.php
            tests/Feature/Admin/RoomAreaGuidePageTest.php
            tests/Unit/Support/HtmlContentSanitizerTest.php
            tests/Unit/Support/PlainTextLimiterTest.php
            tests/Feature/BlogPhase1FixesTest.php
            tests/Feature/BlogPhase2AdminTest.php
            tests/Unit/Services/BlogPostQualityTest.php
            tests/Feature/BlogPhase3PublicTest.php
            tests/Unit/Support/SecurityHardeningTest.php
            tests/Feature/OnPageSeoBatch2Test.php
            tests/Unit/Support/SeoGeoTest.php
            tests/Feature/OnPageSeoBatch3Test.php
            tests/Feature/OnPageSeoBatch4Test.php
            tests/Feature/OnPageSeoBatch5Test.php
            tests/Feature/PublicPageBannedWordsTest.php
            tests/Feature/Admin/OffcutInventoryTest.php
            tests/Feature/Admin/QuotationCutListImportTest.php
            tests/Unit/Services/MillworkQuotationCalculatorTest.php
            tests/Feature/Admin/MillworkQuotationPagesTest.php
            tests/Feature/Admin/MillworkLeaveSaveBrowserTest.php
            tests/Feature/Admin/MillworkCreateBrowserTest.php
            tests/Feature/Admin/MillworkResaveBrowserTest.php
            tests/Feature/Admin/MillworkQuotationRoundTripTest.php
            tests/Feature/Admin/MillworkCutPlanPlacementTest.php
            tests/Unit/Views/HomeServiceTileUppercaseTest.php
            tests/Unit/Views/QuotationExpensePairLayoutTest.php
            tests/Unit/Support/QuotationWorkDescriptionStyleTest.php
            tests/Unit/Services/QuotationWorkDescriptionInstructionTest.php
            tests/Unit/Services/QuotationWorkDescriptionFenceContextTest.php
            tests/Unit/Services/QuotationWorkDescriptionLowDeckContextTest.php
            tests/Unit/Services/QuotationWorkDescriptionStandardContextTest.php
            tests/Unit/Services/QuotationWorkDescriptionAiServiceTest.php
            tests/Unit/Models/ClientProjectQuotationPdfLineItemsTest.php
            tests/Unit/Models/ClientProjectQuotationPdfFoldV2Test.php
            tests/Unit/Models/ClientProjectQuotationPdfFoldV3Test.php
            tests/Unit/Models/ClientProjectQuotationPdfFoldV2IdentityTest.php
            tests/Unit/Models/ClientProjectQuotationPdfFoldV2SqLinkedIdentityTest.php
            tests/Unit/Models/ClientProjectQuotationPdfFoldV1IdentityTest.php
            tests/Feature/Quotations/PdfFoldVersionLinkTest.php
            tests/Unit/Models/StandardQuotationPdfLineItemsTest.php
            tests/Unit/Services/StandardQuotationCalculatorTest.php
            tests/Unit/Services/StandardQuotationKitRewriteAuditorTest.php
            tests/Unit/Models/StandardQuotationEditorTotalTest.php
            tests/Feature/Admin/StandardQuotationPurchaseListTest.php
            tests/Unit/Views/StandardQuotationEditorJsTest.php
            tests/Unit/Services/FenceQuotationCalculatorTest.php
            tests/Unit/Services/FenceQuotationScenarioTest.php
            tests/Unit/Services/FenceQuotationOct8FixesTest.php
            tests/Unit/Models/FenceMaterialTest.php
            tests/Unit/Models/FenceQuotationTest.php
            tests/Unit/Models/FenceQuotationLabourHstTest.php
            tests/Unit/Support/FenceWorkDescriptionGeneratorTest.php
            tests/Unit/Support/FenceSideFlagsTest.php
            tests/Unit/Views/FenceQuotationFormRestoreTest.php
            tests/Feature/Admin/FenceQuotationFormRestoreTest.php
            tests/Feature/Admin/FenceQuotationInfoTipTest.php
            tests/Feature/Admin/FenceExistingPostLabourCreditTest.php
            tests/Feature/Admin/MaterialHomeDepotPickerImportTest.php
            tests/Unit/Services/MaterialPriceSyncServiceTest.php
            tests/Unit/Models/MaterialStoreProductUrlTest.php
