name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zanini_renovations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_mysql, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Blade syntax smoke (no database)
        run: |
          php artisan test tests/Unit/Views/BladeSyntaxTest.php
          php artisan test tests/Unit/Views/QuotationPdfPageBreakTest.php tests/Unit/BasementQuotationWizardViewTest.php tests/Unit/Models/BasementQuotationScopePdfTest.php
          php artisan test tests/Unit/Support/AdminListFiltersTest.php

      - name: Cut optimizer unit tests (no database)
        run: php artisan test tests/Unit/Services/CutOptimizerEngineTest.php

      - name: Admin dark-theme CSS coverage (no database)
        run: php artisan test tests/Unit/Views/AdminDarkThemeCoverageTest.php tests/Unit/Views/ClientProjectUtilitiesDarkThemeTest.php tests/Unit/Views/QuotationExpensePairLayoutTest.php

      - name: Public CSS light-only (no database)
        run: |
          php artisan test tests/Unit/Views/PublicCssLightOnlyTest.php
          php artisan test tests/Unit/Views/PublicMobileNavDropdownTest.php
          php artisan test tests/Unit/Views/HomeServiceTileUppercaseTest.php
          php artisan test tests/Unit/Views/HomeKitchenTileImageTest.php

      - name: Route smoke (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_renovations_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test tests/Feature/Smoke

      - name: Quote acceptance (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_renovations_test
          DB_USERNAME: root
          DB_PASSWORD: root
          QUOTE_ACCEPT_API_TOKEN: ci-quote-accept-token
        run: php artisan test tests/Feature/QuoteAcceptance

      - name: E-transfer matching
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_renovations_test
          DB_USERNAME: root
          DB_PASSWORD: root
          ETRANSFER_API_TOKEN: ci-etransfer-token
          QUOTE_ACCEPT_API_TOKEN: ci-quote-accept-token
        run: |
          php artisan test tests/Unit/Services/EtransferNoticeParserTest.php
          php artisan test tests/Unit/Services/EtransferInvoiceMatcherTest.php
          php artisan test tests/Feature/Etransfer
          php artisan test tests/Feature/Invoices/MarkPaidInvoiceTest.php

      - name: Feature tests (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zanini_renovations_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --filter="GlobalFinancialsTest|GlobalSearchApiTest|QuickStatusChangeTest|DuplicateQuotationTest|ExpenseAmountParsingTest|HourlyInvoiceUpdateTest|DashboardActionFirstLayoutTest|CancelledProjectInvoiceExclusionTest|ClientIndexAddressSearchTest|ClientProjectFiltersAccordionTest|RoomAreaCanvasDataTest|RoomAreaCanvasObjectsTest|RoomAreaPdfExportTest|BasementRoomAreaImportTest|BasementQuotationMathRoundTripTest|BasementQuotationPagesTest|RoomAreaQuoteQuantitiesTest|RoomAreaQuoteLinesTest|RoomAreaQuotePrefillTest|RoomAreaSharedWallsTest|RoomAreaMeasurementParserTest|RoomAreaClosingErrorTest|RoomAreaPhotosTest|ClientProjectRoomAreaPageTest|UtilitiesRoomAreaPageTest|RoomAreaGuidePageTest|HtmlContentSanitizerTest|PlainTextLimiterTest|BlogPhase1FixesTest|BlogPhase2AdminTest|BlogPostQualityTest|BlogPhase3PublicTest|SecurityHardeningTest|OnPageSeoBatch2Test|SeoGeoTest|OnPageSeoBatch3Test|OnPageSeoBatch4Test|OnPageSeoBatch5Test|PublicPageBannedWordsTest|OffcutInventoryTest|QuotationCutListImportTest|MillworkQuotationCalculatorTest|MillworkQuotationPagesTest|MillworkQuotationRoundTripTest|HomeServiceTileUppercaseTest|QuotationExpensePairLayoutTest|QuotationWorkDescriptionStyleTest|QuotationWorkDescriptionInstructionTest|QuotationWorkDescriptionFenceContextTest|QuotationWorkDescriptionLowDeckContextTest|QuotationWorkDescriptionStandardContextTest|QuotationWorkDescriptionAiServiceTest|ClientProjectQuotationPdfLineItemsTest|StandardQuotationPdfLineItemsTest|StandardQuotationCalculatorTest|StandardQuotationPurchaseListTest|FenceQuotationCalculatorTest|FenceQuotationScenarioTest|FenceQuotationOct8FixesTest|FenceMaterialTest|FenceQuotationTest|FenceQuotationLabourHstTest|FenceWorkDescriptionGeneratorTest|FenceSideFlagsTest|FenceQuotationFormRestoreTest"
