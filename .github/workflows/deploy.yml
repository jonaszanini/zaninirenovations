name: Deploy to Hostinger (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          REMOTE_DEPLOY_PATH="$(ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" bash -s << REMOTE_EOF
          set -e
          DEPLOY_ROOT="${DEPLOY_ROOT}"
          if [ -n "\$DEPLOY_ROOT" ] && [ -d "\$DEPLOY_ROOT" ]; then
            echo "\$DEPLOY_ROOT"
          elif [ -d "\$HOME/files/public_html" ]; then
            echo "\$HOME/files/public_html"
          elif [ -d "\$HOME/public_html" ]; then
            echo "\$HOME/public_html"
          else
            echo "__NOT_FOUND__"
          fi
          REMOTE_EOF
          )"

          if [ "${REMOTE_DEPLOY_PATH}" = "__NOT_FOUND__" ]; then
            echo "ERROR: Could not find deploy directory. Set GitHub Environment variable DEPLOY_ROOT to the full path (e.g. /home/u123456789/files/public_html), or ensure \$HOME/files/public_html or \$HOME/public_html exists."
            exit 1
          fi

          echo "Deploying files to: ${REMOTE_DEPLOY_PATH}"
          rsync -az \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "storage/framework/" \
            --exclude "storage/logs/" \
            -e "ssh -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_DEPLOY_PATH}/"

      - name: Run Laravel deploy commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" bash -s << 'REMOTE_EOF'
          set -e
          DEPLOY_ROOT="${{ vars.DEPLOY_ROOT }}"
          if [ -n "$DEPLOY_ROOT" ] && [ -d "$DEPLOY_ROOT" ]; then
            APP_DIR="$DEPLOY_ROOT"
          elif [ -d "${HOME}/files/public_html" ]; then
            APP_DIR="${HOME}/files/public_html"
          elif [ -d "${HOME}/public_html" ]; then
            APP_DIR="${HOME}/public_html"
          else
            echo "ERROR: Could not find app directory. Set Environment variable DEPLOY_ROOT to the full path to public_html."
            exit 1
          fi

          echo "Running deploy commands in: ${APP_DIR}"
          cd "${APP_DIR}"

          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          fi

          if [ -f artisan ]; then
            if [ ! -f .env ]; then
              echo "ERROR: ${APP_DIR}/.env is missing."
              echo "If you use Hostinger File Manager, .env often belongs in ~/files/public_html (not ~/public_html). Copy .env.example to .env there and set DB_* from hPanel."
              echo "You can pin the path: GitHub repo Settings -> Environments -> PROD -> Environment variables -> DEPLOY_ROOT = /home/YOUR_USER/files/public_html"
              ls -la "${HOME}/files/public_html/.env" "${HOME}/public_html/.env" 2>/dev/null || true
              exit 1
            fi

            php artisan config:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:clear
            php artisan view:cache
          fi
          REMOTE_EOF
