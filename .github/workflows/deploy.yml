name: Deploy to Hostinger (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    env:
      DEPLOY_ROOT: /home/u372714627/domains/zaninirenovations.ca/public_html


    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "Deploying files to: ${DEPLOY_ROOT}"
          SSH_ARGS="-p ${SSH_PORT} -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          connected=0
          for attempt in 1 2 3; do
            echo "Checking SSH connectivity (attempt ${attempt}/3)..."
            if ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "test -d '${DEPLOY_ROOT}'"; then
              connected=1
              break
            fi
            sleep 8
          done

          if [ "${connected}" -ne 1 ]; then
            echo "ERROR: Could not connect to SSH host after 3 attempts (or deploy path check failed)."
            echo "Hostinger can occasionally timeout under load; retrying the workflow usually resolves it."
            exit 1
          fi

          rsynced=0
          for attempt in 1 2 3; do
            echo "Syncing files (attempt ${attempt}/3)..."
            if rsync -az \
              --exclude ".git/" \
              --exclude ".github/" \
              --exclude ".env" \
              --exclude "node_modules/" \
              --exclude "storage/framework/" \
              --exclude "storage/logs/" \
              -e "ssh ${SSH_ARGS}" \
              ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_ROOT}/"; then
              rsynced=1
              break
            fi
            sleep 8
          done

          if [ "${rsynced}" -ne 1 ]; then
            echo "ERROR: File sync failed after 3 attempts."
            exit 1
          fi

      - name: Run Laravel deploy commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_ROOT: /home/u372714627/domains/zaninirenovations.ca/public_html
        run: |
          ssh -p "${SSH_PORT}" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "${SSH_USER}@${SSH_HOST}" "DEPLOY_ROOT='${DEPLOY_ROOT}' bash -s" << 'REMOTE_EOF'
          set -euo pipefail
          APP_DIR="$DEPLOY_ROOT"
          if [ ! -d "${APP_DIR}" ]; then
            echo "ERROR: App directory does not exist: ${APP_DIR}"
            exit 1
          fi

          echo "Running deploy commands in: ${APP_DIR}"
          cd "${APP_DIR}"

          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          fi

          if [ -f artisan ]; then
            if [ ! -f .env ]; then
              echo "ERROR: ${APP_DIR}/.env is missing."
              exit 1
            fi

            # Ensure /storage/* image URLs resolve in production.
            php artisan storage:link 2>/dev/null || true
            if [ ! -d public/storage ]; then
              mkdir -p public/storage
            fi
            if [ -d storage/app/public ]; then
              rsync -a storage/app/public/ public/storage/ 2>/dev/null || cp -R storage/app/public/. public/storage/ 2>/dev/null || true
            fi
            # Keep writable directories healthy on shared hosting.
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            php artisan optimize:clear
            php artisan migrate --force
            # Rebuilds bootstrap/cache/config.php from the server’s current .env. If you change .env without redeploying, run: php artisan config:clear && php artisan config:cache
            php artisan config:cache
            php artisan route:clear
            php artisan view:cache
          fi
          REMOTE_EOF
