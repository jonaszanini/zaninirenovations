name: Deploy to Hostinger (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD

    env:
      DEPLOY_PATH: public_html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          REMOTE_DEPLOY_PATH="$(ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" '
            for d in "$HOME/files/public_html" "$HOME/public_html"; do
              if [ -d "$d" ] && [ -f "$d/artisan" ]; then
                echo "$d"
                exit 0
              fi
            done
            for d in "$HOME/files/public_html" "$HOME/public_html"; do
              if [ -d "$d" ] && [ -f "$d/composer.json" ]; then
                echo "$d"
                exit 0
              fi
            done
            for d in "$HOME/files/public_html" "$HOME/public_html"; do
              if [ -d "$d" ] && [ -f "$d/.env" ]; then
                echo "$d"
                exit 0
              fi
            done
            for d in "$HOME/files/public_html" "$HOME/public_html"; do
              if [ -d "$d" ]; then
                echo "$d"
                exit 0
              fi
            done
            echo "__NOT_FOUND__"
          ')"

          if [ "${REMOTE_DEPLOY_PATH}" = "__NOT_FOUND__" ]; then
            echo "ERROR: Could not find deploy directory. Checked \$HOME/public_html and \$HOME/files/public_html."
            exit 1
          fi

          echo "Deploying files to: ${REMOTE_DEPLOY_PATH}"
          rsync -az \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "storage/framework/" \
            --exclude "storage/logs/" \
            -e "ssh -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_DEPLOY_PATH}/"

      - name: Run Laravel deploy commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" << 'EOF'
          set -e
          APP_DIR=""
          for d in "${HOME}/files/public_html" "${HOME}/public_html"; do
            if [ -d "$d" ] && [ -f "$d/artisan" ]; then
              APP_DIR="$d"
              break
            fi
          done
          if [ -z "${APP_DIR}" ]; then
            for d in "${HOME}/files/public_html" "${HOME}/public_html"; do
              if [ -d "$d" ] && [ -f "$d/composer.json" ]; then
                APP_DIR="$d"
                break
              fi
            done
          fi
          if [ -z "${APP_DIR}" ]; then
            for d in "${HOME}/files/public_html" "${HOME}/public_html"; do
              if [ -d "$d" ] && [ -f "$d/.env" ]; then
                APP_DIR="$d"
                break
              fi
            done
          fi
          if [ -z "${APP_DIR}" ]; then
            for d in "${HOME}/files/public_html" "${HOME}/public_html"; do
              if [ -d "$d" ]; then
                APP_DIR="$d"
                break
              fi
            done
          fi
          if [ -z "${APP_DIR}" ]; then
            echo "ERROR: Could not find app directory. Checked \$HOME/public_html and \$HOME/files/public_html."
            exit 1
          fi

          echo "Running deploy commands in: ${APP_DIR}"
          cd "${APP_DIR}"

          if command -v composer >/dev/null 2>&1; then
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          fi

          if [ -f artisan ]; then
            if [ ! -f .env ]; then
              echo "ERROR: ${APP_DIR}/.env is missing. On Hostinger, copy .env.example to .env and set DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_HOST from hPanel -> Databases (then php artisan key:generate if needed)."
              exit 1
            fi

            php artisan config:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:clear
            php artisan view:cache
          fi
          EOF
