name: Deploy to Hostinger (Production)

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  require-tests:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Checkout pin-deploy-sha helper
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/pin-deploy-sha.sh
            .github/scripts/require-tests-conclusion.sh
          sparse-checkout-cone-mode: false

      - name: Pin the exact SHA and require a successful Tests run
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          export EVENT_NAME WORKFLOW_RUN_SHA DISPATCH_SHA MAIN_SHA
          PINNED="$(bash .github/scripts/pin-deploy-sha.sh | awk -F= '/^sha=/{print $2; exit}')"
          if [ -z "$PINNED" ]; then
            echo "pin-deploy-sha.sh did not emit sha="
            exit 1
          fi
          echo "sha=${PINNED}" >> "$GITHUB_OUTPUT"

          echo "Looking for a successful Tests run on ${PINNED}"
          attempts=90
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            attempts=1
          fi
          for i in $(seq 1 "$attempts"); do
            payload="$(gh run list --repo "$REPO" --workflow Tests --commit "$PINNED" --json conclusion,status)"
            conclusion="$(printf '%s' "$payload" | jq -r '[.[] | select(.status=="completed")] | .[0].conclusion // empty')"
            inflight="$(printf '%s' "$payload" | jq -r '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')"
            if [ "$conclusion" = "success" ] || [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "timed_out" ]; then
              TESTS_CONCLUSION="$conclusion" bash .github/scripts/require-tests-conclusion.sh
              MAIN_SHA="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
              PINNED_SHA="$PINNED" MAIN_SHA="$MAIN_SHA" bash .github/scripts/pin-deploy-sha.sh >/dev/null
              exit 0
            fi
            echo "Waiting for Tests on ${PINNED} (attempt ${i}, in-flight=${inflight})"
            sleep 20
          done
          echo "Timed out waiting for Tests on ${PINNED}. Run the Tests workflow first."
          TESTS_CONCLUSION="" bash .github/scripts/require-tests-conclusion.sh

  deploy:
    needs: [require-tests]
    if: ${{ always() && needs.require-tests.result == 'success' && ((github.event_name == 'workflow_dispatch') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PROD
    permissions:
      contents: read

    env:
      DEPLOY_ROOT: /home/u372714627/domains/zaninirenovations.ca/public_html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.require-tests.outputs.sha }}

      - name: Confirm checkout SHA matches the green-tested pin
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          WANT="${{ needs.require-tests.outputs.sha }}"
          echo "checked out ${GOT}; required ${WANT}"
          test -n "$WANT"
          test "$GOT" = "$WANT"

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Recheck pin is still current main before deploy side effects
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PINNED_SHA: ${{ needs.require-tests.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$PINNED_SHA"
          HEAD="$(git rev-parse HEAD)"
          echo "checked out ${HEAD}; pinned ${PINNED_SHA}"
          test "$HEAD" = "$PINNED_SHA"
          MAIN_SHA="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          PINNED_SHA="$PINNED_SHA" MAIN_SHA="$MAIN_SHA" bash .github/scripts/pin-deploy-sha.sh
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          SSH_ARGS="-p ${SSH_PORT} -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"
          RSYNC_EXCLUDES=(
            --exclude ".git/"
            --exclude ".github/"
            --exclude ".env"
            --exclude "node_modules/"
            --exclude "storage/framework/"
            --exclude "storage/logs/"
          )

          echo "Deploying to: ${DEPLOY_ROOT}"

          echo "[connect] Checking SSH connectivity..."
          ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "test -d '${DEPLOY_ROOT}'"

          echo "[rsync] Syncing files..."
          rsync -az --timeout=120 \
            "${RSYNC_EXCLUDES[@]}" \
            -e "ssh ${SSH_ARGS}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_ROOT}/"

          # Mirror database/migrations EXACTLY (with --delete) so files removed
          # or renamed in the repo are also removed on the server. The main
          # rsync above intentionally has no --delete (it must not touch
          # server-only paths like vendor/), so orphaned migration files would
          # otherwise linger and run again as "pending", causing duplicate
          # column/table errors. Scoping --delete to this folder is safe
          # because migrations must always mirror the repo one-to-one.
          echo "[rsync] Mirroring database/migrations (with --delete)..."
          rsync -az --delete --timeout=120 \
            -e "ssh ${SSH_ARGS}" \
            ./database/migrations/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_ROOT}/database/migrations/"

          echo "[cleanup] Removing debug/phpinfo scripts from server..."
          ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "rm -f '${DEPLOY_ROOT}/public/test.php' '${DEPLOY_ROOT}/public/info.php' '${DEPLOY_ROOT}/public/phpinfo.php' '${DEPLOY_ROOT}/test.php' '${DEPLOY_ROOT}/info.php' '${DEPLOY_ROOT}/phpinfo.php' '${DEPLOY_ROOT}/public/contact_email.php' '${DEPLOY_ROOT}/contact_email.php' '${DEPLOY_ROOT}/public/admin-login.html' '${DEPLOY_ROOT}/admin-login.html'"

          echo "[remote] Running Laravel deploy commands..."
          ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "export DEPLOY_ROOT='${DEPLOY_ROOT}'; bash -s" < .github/scripts/remote-laravel-deploy.sh

          echo "Deploy completed successfully."
