name: Rotate production DB password

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PROD
    permissions:
      contents: read

    env:
      DEPLOY_ROOT: /home/u372714627/domains/zaninirenovations.ca/public_html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rotate DB_PASSWORD on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          NEW_DB_PASSWORD: ${{ secrets.NEW_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${NEW_DB_PASSWORD}" ]; then
            echo "ERROR: NEW_DB_PASSWORD secret is empty." >&2
            exit 1
          fi
          echo "::add-mask::${NEW_DB_PASSWORD}"

          SSH_ARGS="-p ${SSH_PORT} -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes"

          echo "[connect] Checking SSH connectivity..."
          ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "test -d '${DEPLOY_ROOT}'"

          WORKDIR="${DEPLOY_ROOT}/.rotate-db-password"
          echo "[remote] Uploading rotate helpers..."
          ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "rm -rf '${WORKDIR}' && mkdir -p '${WORKDIR}' && chmod 700 '${WORKDIR}'"
          ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "cat > '${WORKDIR}/rewrite-env-db-password.php'" \
            < .github/scripts/rewrite-env-db-password.php
          ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" "cat > '${WORKDIR}/remote-rotate-db-password.sh'" \
            < .github/scripts/remote-rotate-db-password.sh

          set +e
          python3 -c 'import os, sys; sys.stdout.write(os.environ.get("NEW_DB_PASSWORD") or "")' \
            | ssh ${SSH_ARGS} "${SSH_USER}@${SSH_HOST}" \
            "chmod 700 '${WORKDIR}/remote-rotate-db-password.sh' '${WORKDIR}/rewrite-env-db-password.php'; export DEPLOY_ROOT='${DEPLOY_ROOT}'; bash '${WORKDIR}/remote-rotate-db-password.sh'; status=\$?; rm -rf '${WORKDIR}'; exit \$status"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "ERROR: remote password rotation failed (no secret printed)." >&2
            exit "$status"
          fi

          echo "DB password rotation completed."
